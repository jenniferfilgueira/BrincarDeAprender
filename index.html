<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Menu Principal - Brincar de Aprender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body { background-color: #f0f0f0; }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav-side { width: 150px; }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2b2171;
            text-align: center;
        }

        .background-purple {
            background-color: #2b2171;
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .menu-board {
            background-color: #add8e6;
            width: 80%;
            max-width: 600px;
            min-height: 350px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            gap: 20px;
        }

        .aula-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .title-banner {
            background-color: #4da6ff;
            color: white;
            padding: 15px 40px;
            border-radius: 20px;
            border: 3px solid white;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s;
            width: 80%;
        }

        .title-banner:active {
            transform: scale(0.97);
        }

        .games-list {
            display: none; /* Oculta a lista de jogos por padrão */
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Classe que será adicionada pelo JavaScript para mostrar os jogos */
        .games-list.mostrar {
            display: flex; 
        }

        .game-link {
            text-decoration: none;
            background-color: #2ecc71;
            color: white;
            padding: 15px 50px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 5px 0 #27ae60;
            transition: transform 0.1s, box-shadow 0.1s;
            width: 80%;
            text-align: center;
        }

        .game-link:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #27ae60;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-side"></div>
        <div class="logo">Brinca de Aprender</div>
        <div class="nav-side"></div>
    </header>

    <main class="background-purple">
        <div class="menu-board">
            
            <!-- AULA 00 -->
            <div class="aula-section">
                <!-- Adicionado o onclick -->
                <div class="title-banner" onclick="alternarAula(this)">AULA 00</div>
                <div class="games-list">
                    <a href="./jogo_alfabeto/index.html" class="game-link"> Jogo do Alfabeto</a>
                    <a href="./jogo_silaba/" class="game-link"> Jogo da Silabas</a>
                    <a href="./jogo_soma/index.html" class="game-link"> Jogo da Soma</a>
                    <a href="./jogo_subtracao/" class="game-link"> Jogo da Subtração</a>
                </div>
            </div>

            <!-- AULA 01 -->
            <div class="aula-section">
                <!-- Adicionado o onclick -->
                <div class="title-banner" onclick="alternarAula(this)">AULA 01</div>
                <div class="games-list">
                    <a href="./jogo_multiplicacao/index.html" class="game-link"> Jogo da Multiplicação</a>
                    <!-- próximos jogos aqui embaixo -->
                </div>
            </div>

        </div>
    </main>

    <script>
        function alternarAula(elementoClicado) {
            const listaJogos = elementoClicado.nextElementSibling;
            
            listaJogos.classList.toggle('mostrar');
        }
    </script>
</body>
</html>
