<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brincar de Aprender - Subtração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-side">
            <div id="cronometro" class="timer">⏱️ 00:00</div>
        </div>
        <div class="logo">Brinca de Aprender</div>
        <div class="nav-side">
            <a href="../index.html" class="btn-yellow" style="text-decoration: none;">Voltar</a>
        </div>
    </header>

    <main class="background-purple">
        <div class="game-board">
            <div class="title-banner" id="titulo-nivel">NÍVEL 1: CONTE E SUBTRAIA</div>
            
            <div class="math-container" id="container-conta"></div>
            
            <div class="options-container" id="container-opcoes"></div>
            
            <div class="controls-container">
                <button id="btn-proximo" class="btn-action btn-green hidden">Próximo Nível ➡️</button>
                <button id="btn-reiniciar" class="btn-action btn-red hidden">Jogar Novamente 🔄</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
