<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brincar de Aprender - Jogo das Sílabas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-side">
            <div id="cronometro" class="timer hidden">⏱️ 00:00</div>
        </div>
        <div class="logo">Brinca de Aprender</div>
        <div class="nav-side">
            <a href="../index.html" class="btn-yellow" style="text-decoration: none;">Voltar</a>
        </div>
    </header>

    <main class="background-purple">
        <div class="game-board">
            
            <div id="tela-inicial" class="start-screen">
                <h1 class="game-title">JOGO DAS SÍLABAS</h1>
                <p>Arraste as sílabas corretas para formar o nome das figuras!</p>
                <button id="btn-iniciar" class="btn-action btn-pastel-green">Vamos Jogar</button>
            </div>

            <div id="tela-jogo" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="title-banner" id="titulo-nivel">NÍVEL 1</div>
                
                <div class="words-container" id="container-palavras"></div>
                
                <div class="scattered-container" id="container-silabas"></div>
                
                <div class="controls-container">
                    <button id="btn-verificar" class="btn-action btn-blue">Verificar Resposta ✅</button>
                    <button id="btn-proximo" class="btn-action btn-green hidden">Próximo Nível ➡️</button>
                    <button id="btn-reiniciar" class="btn-action btn-red hidden">Tentar Novamente 🔄</button>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
