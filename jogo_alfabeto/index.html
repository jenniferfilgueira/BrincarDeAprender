<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brincar de Aprender - Alfabeto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-side">
            <div id="cronometro" class="timer">⏱️ 00:00</div>
        </div>
        <div class="logo">Brinca de Aprender</div>
        <div class="nav-side"></div>
    </header>

    <main class="background-purple">
        <div class="game-board">
            <div class="title-banner" id="titulo-nivel">ARRASTE A LETRA INICAL ATÉ A IMAGEM</div>
            
            <div class="items-container" id="container-imagens"></div>
            <div class="letters-container" id="container-letras"></div>
            
            <div class="controls-container">
                <button id="btn-proximo" class="btn-action btn-green hidden">Próximo ➡️</button>
                <button id="btn-reiniciar" class="btn-action btn-red hidden">Tentar Novamente 🔄</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
